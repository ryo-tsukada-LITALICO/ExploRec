<!-- 役割: 記録操作と探索セッション情報をカード形式で表示する拡張ポップアップUI -->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>ExploRec</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        width: 380px;
        margin: 0;
        padding: 12px;
        background: #f6f7fb;
        color: #1f2937;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        flex: 1;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 7px 8px;
        background: #f8fafc;
      }
      textarea,
      input {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 8px;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .title {
        font-size: 15px;
        font-weight: 700;
      }
      #statusBadge {
        font-size: 12px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        background: #e5e7eb;
      }
      #statusBadge.status-recording {
        background: #dcfce7;
        color: #166534;
      }
      .section-title {
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 6px;
        color: #475569;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .summary-item {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 6px;
        text-align: center;
      }
      .summary-item strong {
        display: block;
        font-size: 14px;
      }
      #steps {
        max-height: 320px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .step {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 8px;
        background: #fff;
      }
      .thumb {
        width: 100%;
        margin-top: 6px;
        border-radius: 6px;
      }
      .step-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .step-tag {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 999px;
        background: #eef2ff;
        color: #3730a3;
      }
      .step-click {
        border-left: 4px solid #60a5fa;
      }
      .step-input {
        border-left: 4px solid #34d399;
      }
      .step-message {
        border-left: 4px solid #f59e0b;
      }
      .step-navigate {
        border-left: 4px solid #a78bfa;
      }
      .step-screenshot {
        border-left: 4px solid #f472b6;
      }
      .step-memo {
        border-left: 4px solid #22c55e;
      }
      .muted {
        color: #64748b;
        font-size: 12px;
      }
      .action-notice {
        margin-top: 6px;
        min-height: 18px;
        font-size: 12px;
        color: #0f766e;
      }
      .button-busy {
        opacity: 0.75;
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="title">ExploRec</div>
        <div id="statusBadge">停止中</div>
      </div>
      <div id="meta" class="muted">ステップ数: 0</div>
      <div id="actionNotice" class="action-notice" aria-live="polite"></div>
      <div id="summary" class="summary-grid" style="margin-top: 8px;"></div>
    </div>

    <div class="card">
      <div class="section-title">セッション情報</div>
      <div class="row" style="margin-top: 0;">
        <textarea id="testPurpose" placeholder="探索テストの目的" rows="2" style="width: 100%;"></textarea>
      </div>
      <div class="row">
        <textarea id="sessionFocus" placeholder="このセッションで確認したいこと" rows="2" style="width: 100%;"></textarea>
      </div>
      <div class="row">
        <button id="saveSessionContext">セッション目的を保存</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">記録操作</div>
      <div class="row" style="margin-top: 0;">
        <button id="toggleRecording">開始</button>
        <button id="pauseResumeButton">一時中断</button>
      </div>
      <div class="row">
        <button id="takeScreenshot">スクリーンショット</button>
        <button id="saveMemo">メモのみ保存</button>
      </div>
      <div class="row">
        <input id="screenshotMemo" type="text" placeholder="スクリーンショット/メモの内容（任意）" style="width: 100%;" />
      </div>
      <div class="row">
        <button id="exportJson">JSON書き出し</button>
        <button id="clearSteps">クリア</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">記録ステップ</div>
      <div id="steps"></div>
    </div>
    <script src="src/lib/popup-presenter.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
